---
- name: Set hostname
  ansible.builtin.hostname:
    name: "hecklevision"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update apt cache (retry around first-boot lock contention)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: apt_update_result
  retries: 10
  delay: 15
  until: apt_update_result is succeeded

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - parted
      - e2fsprogs
      - rsync
      - python3-docker
      - unattended-upgrades
    state: present
  register: apt_install_result
  retries: 5
  delay: 15
  until: apt_install_result is succeeded

- name: Enable unattended-upgrades (security only)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    owner: root
    group: root
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Restrict unattended-upgrades to security updates only
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51hecklevision-unattended
    mode: "0644"
    owner: root
    group: root
    content: |
      // Managed by Ansible. Security-only origins.
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

# --- Full package upgrade (opt-in: `./scripts/apply.sh -- --tags upgrade`) ---
# Unattended-upgrades only covers Ubuntu security origins, so this is what
# picks up everything else, including docker-ce from Docker's apt repo.

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    autoremove: true
  register: apt_upgrade_result
  retries: 5
  delay: 15
  until: apt_upgrade_result is succeeded
  tags: [upgrade, never]

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  tags: [upgrade, never]

- name: Reboot to load the new kernel / libraries
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: reboot_required.stat.exists
  tags: [upgrade, never]
