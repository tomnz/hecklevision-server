---
- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart hecklevision

- name: Install systemd unit for the compose stack
  ansible.builtin.template:
    src: hecklevision.service.j2
    dest: /etc/systemd/system/hecklevision.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon-reload
    - restart hecklevision

- name: Ensure SWAG proxy-confs directory exists on the data volume
  ansible.builtin.file:
    path: "{{ swag_config_dir }}/nginx/proxy-confs"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Render hecklevision.subdomain.conf (SWAG reverse proxy)
  ansible.builtin.template:
    src: hecklevision.subdomain.conf.j2
    dest: "{{ swag_config_dir }}/nginx/proxy-confs/hecklevision.subdomain.conf"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: reload swag

# --- Auto-shutdown timer (cost protection) ------------------------------------

- name: Install auto-shutdown service
  ansible.builtin.template:
    src: auto-shutdown.service.j2
    dest: /etc/systemd/system/auto-shutdown.service
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload
  when: auto_shutdown_hours | int > 0

- name: Install auto-shutdown timer
  ansible.builtin.template:
    src: auto-shutdown.timer.j2
    dest: /etc/systemd/system/auto-shutdown.timer
    owner: root
    group: root
    mode: "0644"
  notify: daemon-reload
  when: auto_shutdown_hours | int > 0

- name: Enable auto-shutdown timer
  ansible.builtin.systemd:
    name: auto-shutdown.timer
    enabled: true
    state: started
    daemon_reload: true
  when: auto_shutdown_hours | int > 0

- name: Disable auto-shutdown timer (if hours set to 0)
  ansible.builtin.systemd:
    name: auto-shutdown.timer
    enabled: false
    state: stopped
  when: auto_shutdown_hours | int == 0
  failed_when: false

# --- Container pull + bring-up ------------------------------------------------

- name: Flush handlers so systemd picks up unit changes before the pull
  ansible.builtin.meta: flush_handlers

- name: Pull rtmp image
  community.docker.docker_image:
    name: "{{ rtmp_image }}:{{ image_tag }}"
    source: pull
    force_source: true
  tags: [app, update]

- name: Pull swag image
  community.docker.docker_image:
    name: "{{ swag_image }}"
    source: pull
    force_source: true
  tags: [app, update]

- name: Enable hecklevision.service
  ansible.builtin.systemd:
    name: hecklevision.service
    enabled: true
    daemon_reload: true

- name: Bring the compose stack up (idempotent)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: missing
  tags: [app, update]
